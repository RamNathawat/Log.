name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Build Standalone Web App
        run: |
          if [ -d "app" ]; then
            echo "Building from updated app/ directory..."
            cd app
            npm ci || npm install || true
            npm run build
            cd ..
            rm -rf dist
            cp -r app/dist dist
          else
            npm run build
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Log-App.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Log-App-APK
          path: build-artifacts/Log-App.apk
          retention-days: 30

